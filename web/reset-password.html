<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — LeanPrompt</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -1px;
      color: #fff;
      margin-bottom: 6px;
    }
    .logo span { color: #9966ee; }
    h1 { font-size: 16px; font-weight: 500; color: #94a3b8; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: #9966ee; }
    button {
      width: 100%;
      padding: 11px;
      background: #9966ee;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #7c3aed; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .msg.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .msg.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>Lean</span>Prompt</div>
    <h1 id="subtitle">Set a new password</h1>
    <div class="msg error" id="error-msg"></div>
    <div class="msg success" id="success-msg"></div>
    <form id="reset-form">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required />
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Repeat password" minlength="8" required />
      <button type="submit" id="submit-btn">Set new password</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://synuufxjdejpvpbwcypj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5bnV1ZnhqZGVqcHZwYndjeXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDc4NTEsImV4cCI6MjA5NDIyMzg1MX0.wwn9NvsCZjCGnJAT6D64XWvBK2vC-IPBcqI2Ki41LZw";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("reset-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");
    const subtitle = document.getElementById("subtitle");

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
    }
    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = "block";
      errorMsg.style.display = "none";
      form.style.display = "none";
      subtitle.textContent = "Password updated";
    }

    // Supabase v2 automatically picks up the session from the URL hash on init.
    // We just need to confirm we're in a recovery flow.
    async function init() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash || window.location.search.slice(1));
      const type = params.get("type");
      const errorParam = params.get("error");
      const errorDesc = params.get("error_description");

      if (errorParam) {
        showError(decodeURIComponent((errorDesc || errorParam).replace(/\+/g, " ")));
        form.style.display = "none";
        return;
      }

      if (type !== "recovery") {
        // Maybe Supabase redirected here without the hash — check active session
        const { data } = await supabase.auth.getSession();
        if (!data.session) {
          showError("Invalid or expired reset link. Please request a new one.");
          form.style.display = "none";
          return;
        }
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) { showError("Passwords don't match."); return; }
      if (password.length < 8) { showError("Password must be at least 8 characters."); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating…";
      errorMsg.style.display = "none";

      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        showError(error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "Set new password";
        return;
      }
      showSuccess("Password updated! You can close this tab and sign in to LeanPrompt.");
    });

    init();
  </script>
</body>
</html>
